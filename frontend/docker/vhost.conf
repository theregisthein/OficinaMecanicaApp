<VirtualHost *:80>
    ServerName localhost
    # Aponta o diretório raiz para a pasta 'public' do Laravel
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Garante que o Apache use o arquivo .htaccess (necessário para rotas limpas do Laravel)
        AllowOverride All
        Require all granted
    </Directory>

    # Configuração básica de logs
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>